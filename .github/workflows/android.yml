name: Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, stage-1-foundation, stage-2-sim-scanner, stage-3-inventory, stage-4-excel-ux, stage-5-stable-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install and launch APK on minimum supported Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.rb.app/.MainActivity
            adb shell pidof com.rb.app
            ./gradlew connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.rb.app/.MainActivity
            adb shell pidof com.rb.app
            mkdir -p app/build/reports/device
            adb exec-out screencap -p > app/build/reports/device/api26-launch.png
            adb logcat -d -s AndroidRuntime:E > app/build/reports/device/runtime.log
            python3 -c "from pathlib import Path; raise SystemExit('FATAL EXCEPTION' in Path('app/build/reports/device/runtime.log').read_text())"
      - uses: actions/upload-artifact@v4
        with:
          name: Rb-stage6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/device/
            app/build/reports/screenshots/
            app/build/reports/export/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
